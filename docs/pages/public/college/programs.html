<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs - McKnight's American Football Rankings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static-football-rankings/css/styles.css" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GC17GSJ4S0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GC17GSJ4S0');
    </script>
    <style>
      .college-table th, .college-table td { white-space: nowrap; }
      .college-table { font-size: .9rem; }
      .college-table td.wrap { white-space: normal; min-width: 11rem; max-width: 22rem; }
      .note-box { font-size: .9rem; }
    </style>
</head>
<body>
    <div class="header-banner">
        <img src="/static-football-rankings/images/football-field-top.jpg" alt="Football Field Header" class="w-100" />
    </div>
    <div class="container mt-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/static-football-rankings/">Home</a></li>
                <li class="breadcrumb-item"><a href="/static-football-rankings/pages/public/college/index.html">College</a></li>
                <li class="breadcrumb-item active" aria-current="page">Programs</li>
            </ol>
        </nav>
    </div>
    <div class="container mt-2">
        <h1 id="pageTitle">College Programs</h1>
        <p class="text-muted">Every college program in the database. Choose one for its season-by-season ratings, records, coaches and scores.</p>
        <div class="row g-2 mb-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small mb-1" for="tableSearch">Search</label>
                <input type="text" id="tableSearch" class="form-control" placeholder="Team name..." autocomplete="off">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1" for="levelFilter">Current level</label>
                <select id="levelFilter" class="form-select"></select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1" for="stateFilter">State</label>
                <select id="stateFilter" class="form-select"></select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1" for="minSeasons">Min. seasons</label>
                <input type="number" id="minSeasons" class="form-control" min="0">
            </div>

            <div class="col-md text-md-end text-muted small"><span id="rowCount">0</span> rows · Updated <span id="lastUpdated"></span></div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm college-table" id="dataTable">
                <thead class="sticky-top bg-white"></thead>
                <tbody></tbody>
            </table>
        </div>
        <nav aria-label="Table pages"><ul class="pagination justify-content-end" id="pager"></ul></nav>
        <div class="alert alert-light border note-box mt-3"><span id="ratingNote"></span></div>
        <footer class="mt-5 mb-3">
            <div class="text-center">
                <p>© 2026 McKnight's Football Rankings</p>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static-football-rankings/js/college/college.js"></script>
    <script>

(async () => {
  try {
    const d = await collegeLoad('programs-index.json');
    collegeStamp(d.metadata);
    
    collegeTable({
      data: d.items, tableId: 'dataTable', searchKeys: ['team', 'state'],
      defaultSort: { key: 'team', dir: 1 }, pageSize: 200,
      filters: [{ id: 'levelFilter', key: 'level', type: 'select' }, { id: 'stateFilter', key: 'state', type: 'select' },
                { id: 'minSeasons', key: 'seasons', type: 'min', default: 1 }],
      columns: [
        { key: 'team', label: 'Program', link: 'slug' }, { key: 'state', label: 'State' }, { key: 'level', label: 'Current level' },
        { key: 'first', label: 'First', num: true }, { key: 'last', label: 'Last', num: true }, { key: 'seasons', label: 'Seasons', num: true } ]
    });
  } catch (e) { console.warn(e); document.getElementById('dataTable').insertAdjacentHTML('beforebegin', '<div class="alert alert-warning">Data not available yet.</div>'); }
})();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program - McKnight's American Football Rankings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static-football-rankings/css/styles.css" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GC17GSJ4S0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GC17GSJ4S0');
    </script>
    <style>
      .college-table th, .college-table td { white-space: nowrap; }
      .note-box { font-size: .9rem; }
    </style>
</head>
<body>
    <div class="header-banner">
        <img src="/static-football-rankings/images/football-field-top.jpg" alt="Football Field Header" class="w-100" />
    </div>
    <div class="container mt-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/static-football-rankings/">Home</a></li>
                <li class="breadcrumb-item"><a href="/static-football-rankings/pages/public/college/index.html">College</a></li><li class="breadcrumb-item"><a href="/static-football-rankings/pages/public/college/programs.html">Programs</a></li>
                <li class="breadcrumb-item active" aria-current="page">Program</li>
            </ol>
        </nav>
    </div>
    <div class="container mt-2">
        <h1 id="progTitle">Program</h1>
        <p class="text-muted" id="progSummary"></p>
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <label class="form-label small mb-1" for="tableSearch">Search</label>
                <input type="text" id="tableSearch" class="form-control" placeholder="Season or coach..." autocomplete="off">
            </div>
            <div class="col-md text-md-end text-muted small align-self-end"><span id="rowCount">0</span> seasons · Updated <span id="lastUpdated"></span></div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm college-table" id="dataTable">
                <thead class="sticky-top bg-white"></thead><tbody></tbody>
            </table>
        </div>
        <nav aria-label="Table pages"><ul class="pagination justify-content-end" id="pager"></ul></nav>
        <h4 class="mt-4" id="gamesTitle">Games</h4>
        <div class="row g-2 mb-2"><div class="col-md-3">
            <label class="form-label small mb-1" for="seasonPick">Season</label>
            <select id="seasonPick" class="form-select"></select>
        </div></div>
        <div class="table-responsive">
            <table class="table table-sm college-table"><thead><tr><th>Date</th><th>Opponent</th><th>Site</th><th>Result</th><th>Score</th></tr></thead>
            <tbody id="gamesBody"></tbody></table>
        </div>
        <p class="small text-muted">Site: H home, A away, N neutral. A blank date means the exact date is not known.</p>
        <div class="alert alert-light border note-box mt-3"><span id="ratingNote"></span></div>
        <footer class="mt-5 mb-3">
            <div class="text-center">
                <p>© 2026 McKnight's Football Rankings</p>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static-football-rankings/js/college/college.js"></script>
    <script>

(async () => {
  const slug = new URLSearchParams(location.search).get('team');
  if (!slug) { document.getElementById('progTitle').textContent = 'No program selected'; return; }
  try {
    const d = await collegeLoad('programs/' + encodeURIComponent(slug) + '.json');
    const p = d.program;
    document.title = p.team + " - College Football - McKnight's American Football Rankings";
    document.getElementById('progTitle').textContent = p.team + (p.state ? ' (' + p.state + ')' : '');
    document.querySelector('.breadcrumb-item.active').textContent = p.team;
    document.getElementById('progSummary').textContent =
      (p.level ? p.level + ' · ' : '') + p.first + '–' + p.last + ' · ' + p.seasons + ' seasons · ' + p.record +
      (p.pct !== null ? ' (' + collegeFmt(p.pct, 'pct') + ')' : '') +
      (p.avg !== null ? ' · average rating ' + collegeFmt(p.avg, 'num1') : '') +
      (p.titles ? ' · ' + p.titles + " McKnight title" + (p.titles > 1 ? 's' : '') : '');
    collegeStamp(d.metadata);
    const rows = d.seasons.map(x => Object.assign({}, x, { rank_of: x.rank ? x.rank + ' of ' + x.of : '' }));
    collegeTable({
      data: rows, tableId: 'dataTable', searchKeys: ['season', 'coach', 'level'], pageSize: 200,
      defaultSort: { key: 'season', dir: -1 },
      columns: [
        { key: 'season', label: 'Season', num: true }, { key: 'level', label: 'Level' },
        { key: 'record', label: 'Record', sortKey: 'w' }, { key: 'pf', label: 'PF', num: true }, { key: 'pa', label: 'PA', num: true },
        { key: 'combined', label: 'Rating', fmt: 'num1', num: true }, { key: 'offense', label: 'Offense', fmt: 'num1', num: true },
        { key: 'defense', label: 'Defense', fmt: 'num1', num: true }, { key: 'rank_of', label: 'Rank', sortKey: 'rank' },
        { key: 'coach', label: 'Coach' }, { key: 'note', label: 'Note' } ]
    });
    const pick = document.getElementById('seasonPick');
    const withGames = d.seasons.filter(x => x.games_list && x.games_list.length).map(x => x.season).sort((a, b) => b - a);
    if (!withGames.length) { document.getElementById('gamesTitle').style.display = 'none'; pick.parentElement.style.display = 'none'; return; }
    pick.innerHTML = withGames.map(s => '<option>' + s + '</option>').join('');
    const show = () => {
      const s = d.seasons.find(x => String(x.season) === pick.value);
      const tb = document.getElementById('gamesBody'); tb.innerHTML = '';
      s.games_list.forEach(g => {
        const tr = document.createElement('tr');
        const res = g.pf > g.pa ? 'W' : g.pf < g.pa ? 'L' : 'T';
        const cells = [g.date, null, g.site, res, g.pf + '-' + g.pa];
        cells.forEach((v, i) => {
          const td = document.createElement('td');
          if (i === 1) td.appendChild(collegeProgramLink(g.opp, g.opp_slug)); else td.textContent = v;
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
    };
    pick.addEventListener('change', show); show();
  } catch (e) {
    console.warn(e);
    document.getElementById('progTitle').textContent = 'Program not found';
  }
})();
    </script>
</body>
</html>
